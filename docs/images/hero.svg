    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="c1"><rect x="700" y="110" width="140" height="140" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="852" y="110" width="140" height="140" rx="14"/></clipPath>
    <clipPath id="c3"><rect x="1004" y="110" width="140" height="140" rx="14"/></clipPath>
